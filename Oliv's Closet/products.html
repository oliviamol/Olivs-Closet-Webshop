<body>
    
    <header>
       
        <div class="nav container">
            <a href="#" class="logo"></a>
          
            <i class='bx bx-shopping-bag' id="cart-icon"></i>
           
            <div class="cart">
                <h2 class="cart-title">Your Cart</h2>
               
                <div class="cart-content">

                </div>
               
                <div class="total">
                    <div class="total-title">Total</div>
                    <div class="total-price">$0</div>
                </div>
              
                <button type="button" class="btn-buy">Buy Now</button>
               
                <i class='bx bx-x' id="close-cart"></i>

            </div>
        </div>
    </header>
   
    <section class="shop container">
        <h2 class="section-title">Shop Products</h2>
        
        <div class="shop-content">
            
            <div class="product-box">
                <img src="poze/da.jpg" alt="" class="product-img">

            </div>
           
            <div class="product-box">

                <span class="price">$100</span>

            </div>
           
            <div class="product-box">
                <img src="poze/daa (2).jpg" alt="" class="product-img">
                <h2 class="product-title">Stofa Pants</h2>
                <span class="price">$45</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            
            <div class="product-box">
                <img src="poze/daa (3).png" alt="" class="product-img">
                <h2 class="product-title">Cool Green Cap</h2>
                <span class="price">$24.04</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
          
            <div class="product-box">
                <img src="poze/blugi.jpg" alt="" class="product-img">
                <h2 class="product-title">New Model Jeans</h2>
                <span class="price">$50</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            
            <div class="product-box">
                <img src="poze/fular.jpg" alt="" class="product-img">

            </div>
           
            <div class="product-box">

                <span class="price">$45</span>
